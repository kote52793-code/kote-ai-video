
<script type="module">
import { Client, handle_file } from "https://esm.sh/@gradio/client";

let mode = "photo";
let videoUrl = null;

const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $("photoPanel").style.display = m === "photo" ? "block" : "none";
  $("photoTab").classList.toggle("active", m === "photo");
  $("textTab").classList.toggle("active", m === "text");
}

$("photoTab").onclick = () => setMode("photo");
$("textTab").onclick = () => setMode("text");

$("photo").onchange = () => {
  const f = $("photo").files[0];
  if (!f) return;

  if (f.size > 10 * 1024 * 1024) {
    alert("Фото должно быть меньше 10 МБ");
    return;
  }

  const r = new FileReader();
  r.onload = () => {
    $("preview").src = r.result;
    $("preview").style.display = "block";
    $("fileName").textContent = f.name;
  };
  r.readAsDataURL(f);
};

$("generate").onclick = async () => {
  const prompt = $("prompt").value.trim();
  const file = $("photo").files[0];

  if (!prompt) {
    alert("Напиши описание видео");
    return;
  }

  if (!file) {
    alert("Сначала загрузи фотографию");
    return;
  }

  const btn = $("generate");
  btn.disabled = true;
  $("resultPanel").hidden = true;
  $("status").textContent = "Подключаем Wan 2.2...";

  try {
    const client = await Client.connect("JCisHERE/wan2-2-i2v-v3");

    $("status").textContent = "Загружаем фото и создаём видео. Это может занять несколько минут...";

    const result = await client.predict("/generate_video", {
      input_image: await handle_file(file),
      last_image: null,
      prompt: prompt,
      steps: 6,
      negative_prompt: "",
      duration_seconds: Number($("duration").value.replace("s", "")),
      guidance_scale: 1,
      guidance_scale_2: 1,
      seed: 42,
      randomize_seed: true,
      quality: 5,
      scheduler: "UniPCMultistep",
      flow_shift: 6,
      frame_multiplier: 16,
      safe_mode: true,
      lora_groups: [],
      auto_lora_enabled: false,
      video_component: true
    });

    const findVideo = value => {
      if (!value) return null;
      if (typeof value === "string" && value.startsWith("http")) return value;
      if (Array.isArray(value)) {
        for (const item of value) {
          const found = findVideo(item);
          if (found) return found;
        }
      }
      if (typeof value === "object") {
        if (value.url) return value.url;
        if (value.video?.url) return value.video.url;
        if (value.path) return value.path;
        for (const item of Object.values(value)) {
          const found = findVideo(item);
          if (found) return found;
        }
      }
      return null;
    };

    const url = findVideo(result.data);

    if (!url) {
      throw new Error("Wan 2.2 не вернул ссылку на видео");
    }

    $("result").src = url;
    $("result").style.display = "block";
    $("download").href = url;
    $("download").style.display = "block";
    $("resultPanel").hidden = false;
    $("status").textContent = "Видео готово! 🎉";

  } catch (e) {
    console.error(e);
    $("status").textContent = "Ошибка: " + (e.message || "Не удалось создать видео");
  } finally {
    btn.disabled = false;
  }
};
</script>
