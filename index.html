

<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const SPACE_URL = "https://jcishere-wan2-2-i2v-v3.hf.space";
const SPACE_NAME = "JCisHERE/wan2-2-i2v-v3";

let mode = "photo";
let imageFile = null;
let videoUrl = null;

const $ = id => document.getElementById(id);

function setMode(m) {
  mode = m;
  $("photoPanel").style.display = m === "photo" ? "block" : "none";
  $("photoTab").classList.toggle("active", m === "photo");
  $("textTab").classList.toggle("active", m === "text");
}

$("photoTab").onclick = () => setMode("photo");
$("textTab").onclick = () => {
  alert("Режим Текст → Видео скоро появится. Сейчас подключаем Фото → Видео.");
  setMode("photo");
};

$("photo").onchange = () => {
  const f = $("photo").files[0];
  if (!f) return;

  if (f.size > 10 * 1024 * 1024) {
    alert("Фото должно быть меньше 10 МБ");
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(f.type)) {
    alert("Нужен JPG, PNG или WEBP");
    return;
  }

  imageFile = f;

  const reader = new FileReader();
  reader.onload = () => {
    $("preview").src = reader.result;
    $("preview").style.display = "block";
    $("fileName").textContent = f.name;
  };
  reader.readAsDataURL(f);
};

$("generate").onclick = async () => {
  const prompt = $("prompt").value.trim();

  if (!prompt) {
    alert("Напиши описание видео");
    return;
  }

  if (!imageFile) {
    alert("Сначала загрузи фотографию");
    return;
  }

  const btn = $("generate");
  btn.disabled = true;
  $("resultPanel").hidden = true;
  $("status").textContent = "Подключаемся к Wan 2.2...";

  try {
    const client = await Client.connect(SPACE_NAME);

    $("status").textContent = "Загружаем фотографию...";

    const result = await client.predict("/generate_video", {
      input_image: handle_file(imageFile),
      last_image: null,
      prompt: prompt,
      steps: 6,
      negative_prompt: "",
      duration_seconds: Number($("duration").value),
      guidance_scale: 1,
      guidance_scale_2: 1,
      seed: 42,
      randomize_seed: true,
      quality: 5,
      scheduler: "UniPCMultistep",
      flow_shift: 6,
      frame_multiplier: "16",
      safe_mode: true,
      lora_groups: [],
      auto_lora_enabled: false,
      video_component: true
    });

    const output = result.data?.[0] || result.data?.[1];
    const url = typeof output === "string"
      ? output
      : output?.url;

    if (!url) {
      throw new Error("Модель не вернула ссылку на видео");
    }

    if (videoUrl) URL.revokeObjectURL(videoUrl);

    const videoResponse = await fetch(url);
    if (!videoResponse.ok) {
      throw new Error("Не удалось загрузить готовое видео");
    }

    const blob = await videoResponse.blob();
    videoUrl = URL.createObjectURL(blob);

    $("result").src = videoUrl;
    $("result").style.display = "block";
    $("download").href = videoUrl;
    $("download").style.display = "block";
    $("resultPanel").hidden = false;
    $("status").textContent = "Видео готово! 🎉";

  } catch (error) {
    console.error(error);
    $("status").textContent = "Ошибка: " + (error.message || "Попробуй ещё раз");
  } finally {
    btn.disabled = false;
  }
};
</script>
