
<script type="module">
import { Client, handle_file } from
"https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

const $ = id => document.getElementById(id);
let mode = "photo";
let videoUrl = null;

function setMode(m) {
  mode = m;
  $("photoPanel").style.display = m === "photo" ? "block" : "none";
  $("photoTab").classList.toggle("active", m === "photo");
  $("textTab").classList.toggle("active", m === "text");
}

$("photoTab").onclick = () => setMode("photo");
$("textTab").onclick = () => setMode("text");

$("photo").onchange = () => {
  const file = $("photo").files[0];
  if (!file) return;

  if (file.size > 10 * 1024 * 1024) {
    alert("Фото должно быть меньше 10 МБ");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    $("preview").src = reader.result;
    $("preview").style.display = "block";
    $("fileName").textContent = file.name;
  };
  reader.readAsDataURL(file);
};

function findVideo(data) {
  if (!data) return null;

  if (typeof data === "string") {
    return data.startsWith("http") ? data : null;
  }

  if (Array.isArray(data)) {
    for (const item of data) {
      const found = findVideo(item);
      if (found) return found;
    }
  }

  if (typeof data === "object") {
    if (data.url) return data.url;
    if (data.video) return findVideo(data.video);

    for (const value of Object.values(data)) {
      const found = findVideo(value);
      if (found) return found;
    }
  }

  return null;
}

$("generate").onclick = async () => {
  const file = $("photo").files[0];
  const prompt = $("prompt").value.trim();

  if (!prompt) {
    alert("Напиши описание видео");
    return;
  }

  if (mode === "photo" && !file) {
    alert("Сначала загрузи фотографию");
    return;
  }

  if (mode !== "photo") {
    alert("Wan 2.2 сейчас подключён для генерации из фото");
    return;
  }

  const btn = $("generate");
  btn.disabled = true;
  $("resultPanel").hidden = true;
  $("status").textContent = "Подключаем Wan 2.2...";

  try {
    const client = await Client.connect(
      "JCisHERE/wan2-2-i2v-v3"
    );

    $("status").textContent =
      "Фото отправлено. Генерируем видео, подожди...";

    const result = await client.predict("/generate_video", [
      await handle_file(file),
      null,
      prompt,
      8,
      "",
      Number($("duration").value.replace("s", "")),
      1,
      1,
      42,
      true,
      5,
      "UniPCMultistep",
      6,
      16,
      true,
      [],
      false,
      true
    ]);

    const url = findVideo(result.data);

    if (!url) {
      throw new Error("Сервер не вернул ссылку на видео");
    }

    if (videoUrl) URL.revokeObjectURL(videoUrl);

    $("result").src = url;
    $("result").style.display = "block";
    $("download").href = url;
    $("download").style.display = "block";
    $("resultPanel").hidden = false;
    $("status").textContent = "Видео готово! 🎉";

  } catch (error) {
    console.error(error);
    $("status").textContent =
      "Ошибка подключения или генерации: " +
      (error.message || String(error));
  } finally {
    btn.disabled = false;
  }
};
</script>
